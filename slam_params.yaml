$(var namespace)/slam_toolbox:
  ros__parameters:

    # Solver parameters
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frame parameters
    odom_frame: odom
    base_frame: base_link
    map_frame: map
    scan_topic: scan
    mode: mapping
    
    # Boolean parameters
    use_sim_time: true
    use_scan_matching: true
    do_loop_closing: true
    use_response_expansion: true
    debug_logging: false
    
    # Numerical coefficients
    transform_tolerance: 0.5
    transform_publish_period: 0.1
    minimum_time_interval: 0.1
    map_update_interval: 0.5
    resolution: 0.02
    max_laser_range: 1.6
    min_laser_range: 0.16
    minimum_travel_distance: 0.02
    minimum_travel_heading: 0.0

    pose_optimization_period: 2.0
    scan_queue_size: 50
    scan_buffer_size: 1800
    scan_buffer_maximum_scan_distance: 9.01
    loop_search_maximum_distance: 2.4000000000000004
    loop_match_minimum_chain_size: 5
    loop_match_maximum_variance_coarse: 2.0
    loop_match_minimum_response_coarse: 0.4
    loop_match_minimum_response_fine: 0.5
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.01
    loop_search_space_dimension: 3.2
    loop_search_space_resolution: 0.01
    loop_search_space_smear_deviation: 0.02
    distance_variance_penalty: 0.3
    angle_variance_penalty: 0.6
    minimum_angle_penalty: 0.85
    minimum_distance_penalty: 0.4
    fine_search_angle_offset: 0.00174
    coarse_search_angle_offset: 0.174
    coarse_angle_resolution: 0.0174
